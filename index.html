const STORAGE_KEY = "k1";

const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function keyFromPassword(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(D.s), iterations: D.n, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}

/** Throws if the key is wrong (AES-GCM authenticates the data). */
async function decrypt(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(D.i) }, key, bytes(D.c));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

const TYPES = { js: "text/javascript", mjs: "text/javascript", wasm: "application/wasm" };

/** Fetches + decrypts + unzips one extra file into a blob URL. Rejects on failure. */
async function openFile(entry, key, name) {
  if (!entry) throw new Error("no existe: " + name);
  const res = await fetch(entry.f);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(entry.i) }, key, await res.arrayBuffer());
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  const type = TYPES[name.split(".").pop()] || "application/octet-stream";
  return URL.createObjectURL(new Blob([await new Response(stream).arrayBuffer()], { type }));
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.append(s);
  });
}

/** Replaces the lock page with the decrypted app, all from memory (blob URLs). */
async function launch(app, key) {
  window.__ROOM = app.room;
  // Extra files load on demand, encrypted the same way; blob URL cached per name.
  const opened = {};
  window.__file = (name) => opened[name] ||= openFile(app.vendor?.[name], key, name)
    .catch((e) => { delete opened[name]; throw e; });
  window.__ICE = app.ice || null;
  window.__LOCKED_APP = true;
  window.__LOCK_STORAGE_KEY = STORAGE_KEY;
  window.__ASSETS = {};
  for (const [name, data] of Object.entries(app.assets)) {
    window.__ASSETS[name] = URL.createObjectURL(new Blob([bytes(data)], { type: "audio/wav" }));
  }
  document.title = app.title;
  document.getElementById("lockcss").remove();
  const fonts = document.createElement("link");
  fonts.rel = "stylesheet"; fonts.href = app.fonts;
  document.head.append(fonts);
  const style = document.createElement("style");
  style.textContent = app.css;
  document.head.append(style);
  document.body.innerHTML = app.body;
  try { await loadScript(app.peerjs); } catch { /* the app shows its own "no connection" message */ }
  const map = { imports: {} };
  for (const [name, code] of Object.entries(app.modules)) {
    map.imports["@m/" + name] = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
  }
  const im = document.createElement("script");
  im.type = "importmap";
  im.textContent = JSON.stringify(map);
  document.head.append(im);
  const entry = document.createElement("script");
  entry.type = "module";
  entry.textContent = 'import "@m/app.js";';
  document.body.append(entry);
}

function remembered() {
  try { return localStorage.getItem(STORAGE_KEY); } catch { return null; }
}

async function tryRemembered() {
  const saved = remembered();
  if (!saved) return false;
  try {
    const key = await crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", false, ["decrypt"]);
    await launch(await decrypt(key), key);
    return true;
  } catch {
    try { localStorage.removeItem(STORAGE_KEY); } catch { /* ignore */ }
    return false;
  }
}

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("b");
  const err = document.getElementById("e");
  btn.disabled = true;
  err.textContent = "…";
  try {
    const key = await keyFromPassword(document.getElementById("p").value);
    const app = await decrypt(key);
    if (document.getElementById("r").checked) {
      try { localStorage.setItem(STORAGE_KEY, b64(await crypto.subtle.exportKey("raw", key))); } catch { /* not remembered */ }
    }
    await launch(app, key);
  } catch {
    err.textContent = "Contraseña incorrecta";
    btn.disabled = false;
  }
});

// Installable app: the service worker gives offline open + home-screen install.
// Optional: if it fails, the site works exactly as before.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch((e) => console.warn("sw:", e));
}
// The browser's install offer can fire before the app is unlocked, so keep it here;
// the app's menu button reads window.__installPrompt and listens for "installready".
window.__installPrompt = null;
window.addEventListener("beforeinstallprompt", (ev) => {
  ev.preventDefault();
  window.__installPrompt = ev;
  window.dispatchEvent(new Event("installready"));
});

tryRemembered();
